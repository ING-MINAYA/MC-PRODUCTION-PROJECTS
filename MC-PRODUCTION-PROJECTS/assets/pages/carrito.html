<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | MC PRODUCTIONS</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    
    <nav id="navbar">
        <div class="logo-container">
            <img src="/assets/img/logo.png" alt="Logo MC" class="logo-img">
            <h1 id="logo-texto">MC PRODUCTIONS</h1>
        </div>

        <i class='bx bx-menu' id="icono-menu" style="font-size: 35px; color: white; cursor: pointer; display: none;"></i>
        
        <ul id="menu">
            <li><a href="/index.html">INICIO</a></li>
            <li><a href="tienda.html">TIENDA</a></li>
            <li><a href="/index.html#contacto">CONTACTO</a></li>
            <li><a href="login.html">LOGIN</a></li>
            <li>
                <a href="carrito.html" class="btn-carrito">
                    <i style="color: #8a2be2" class='bx bx-cart'></i>
                </a>
            </li>
        </ul>
    </nav>

    <main class="contenedor-carrito">
        <h1 class="titulo-carrito">TU CARRITO DE COMPRAS</h1>
        
        <!-- Le pusimos un ID para que JS pueda inyectar los productos aquí en el futuro -->
        <div class="lista-carrito" id="lista-carrito">
            
            <!-- Mensaje de Estado Vacío -->
            <div class="carrito-vacio" style="text-align: center; padding: 50px 20px;">
                <i class='bx bx-cart' style="font-size: 60px; color: var(--texto-secundario); margin-bottom: 15px;"></i>
                <h3 style="color: var(--texto-secundario); margin-bottom: 20px;">Tu carrito está vacío</h3>
                <a href="tienda.html" class="btn-primario" style="text-decoration: none; display: inline-block;">IR A LA TIENDA</a>
            </div>

        </div>

        <div class="resumen-carrito">
            <h2>TOTAL: <span class="total-precio">$0.00</span></h2>
            <button class="btn-secundario">PROCEDER AL PAGO</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MC Productions. Todos los derechos reservados.</p>
    </footer>

    <script src="/assets/js/script.js"></script>
</body>
</html>
