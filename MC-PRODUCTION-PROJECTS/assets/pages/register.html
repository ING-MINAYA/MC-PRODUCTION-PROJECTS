<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | MC PRODUCTIONS</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    
    <header id="navbar">
        <div class="logo-container">
            <img src="/assets/img/logo.png" alt="Logo MC" class="logo-img">
            <h1 id="logo-texto">MC PRODUCTIONS</h1>
        </div>
        <a href="/index.html" class="btn-volver">Volver al inicio</a>
    </header>

    <main id="contenedor-login">
        <section class="tarjeta-login">
            <h2>CREAR CUENTA</h2>
            <p>Únete a la nueva generación musical.</p>

            <form action="/register" method="POST">
                
                <div class="grupo-input">
                    <label for="usuario">Nombre de Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Tu nombre" required>
                </div>

                <div class="grupo-input">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="usuario@email.com" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <div class="grupo-input">
                    <label for="confirmar-password">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-primario">REGISTRARSE</button>

                <p class="texto-registro">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MC Productions. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
